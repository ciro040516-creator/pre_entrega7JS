<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador "Teenage Babe"</title>
    <link rel="stylesheet" href="./css/style.css">

    <!--Link Iconos-->
    <script src="https://kit.fontawesome.com/9e89734234.js" crossorigin="anonymous"></script>

    <script defer src="./js/main.js"></script>
</head>

<body>
    <header>
    <img class="logo_tb" src="./img/logo_tb.jpg" alt="logo_tb">
    <div id="box-seccion">
    <h3>${seccion.item}</h3>
    </div>
    </header>

    <main>
        <h4 class="para-Ana"></h4>
        <h4 class="mensaje-general"></h4>

        <form action="#" method="post">
            <h2 class="titulo">Acceso</h2>
            <div>
                <label>
                <i class="fa-solid fa-user"></i>
                <input type="number" id="ID" placeholder="ID" required>
                </label>
            </div>
            <div>
                <label>
                <i class="fa-solid fa-lock"></i>
                <input type="number" id="password" placeholder="contraseña" required>
                </label>
            </div>
            <div>
                <button class="button" id="boton">Ingresar</button>
            </div>
            </form>
            <p></p>
    </main>

    <footer class="footer">
        <p class="textoFooter">© 2026 Proyectos Di&Bere. Todos los derechos reservados.</p>
    </footer>
    
</body>
</html>
